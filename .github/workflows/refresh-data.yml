name: Refresh site data

on:
  schedule:
    - cron: "17 11 * * *"   # daily
  workflow_dispatch:         # "Run workflow" button for an instant refresh

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch-medium.py
      # citations only change the live counts; a failure here must not block new posts
      - run: python3 tools/fetch-citations.py || true
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- assets/medium.json && ! git diff -- assets/citations.json | grep -q '^[-+] .*"[0-9]\|total'; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/medium.json assets/citations.json
          git commit -m "Refresh Medium posts and citations"
          git push
          # pushes made with the workflow token don't always start a Pages build; ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
