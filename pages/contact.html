    <script>

    <script>
    /* Contact form: send in the background, clear it, then show our own thank-you page.
       Without JavaScript the form still posts to Formspree normally. */
    (function () {
        var form = document.getElementById('contactForm');
        var status = document.getElementById('formStatus');
        var btn = form.querySelector('button[type="submit"]');
        if (!window.fetch || !window.FormData) return;
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            btn.disabled = true; btn.textContent = 'Sending…';
            status.textContent = ''; status.className = 'form-status';
            fetch(form.action, { method: 'POST', body: new FormData(form), headers: { 'Accept': 'application/json' } })
                .then(function (r) {
                    if (!r.ok) throw new Error('send failed');
                    form.reset();
                    window.location.href = 'thanks.html';
                })
                .catch(function () {
                    status.textContent = "Sorry, that didn't send. Please try again, or email me at vishal.john@louisville.edu.";
                    status.className = 'form-status error';
                    btn.disabled = false; btn.textContent = 'Send message';
                });
        });
        // coming Back from the thank-you page can restore a stale page; make sure it's empty and usable
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) { form.reset(); btn.disabled = false; btn.textContent = 'Send message'; status.textContent = ''; }
        });
    })();

    /* Voicemail recorder (stored by the site's Cloudflare worker; Vishal gets an email with a link) */
    (function () {
        var VM_API = 'https://vishal-chat.vishaljjohn.workers.dev';
        var MAX_SECONDS = 60, MAX_BYTES = 3 * 1024 * 1024;
        var box = document.getElementById('voicemail');
        if (!box || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) return;

        // only show the recorder when the service answers
        var ctrl = window.AbortController ? new AbortController() : null;
        if (ctrl) setTimeout(function () { ctrl.abort(); }, 5000);
        fetch(VM_API + '/voicemail/ping', { signal: ctrl ? ctrl.signal : undefined })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) { if (j && j.ok) box.hidden = false; })
            .catch(function () {});

        var recBtn = document.getElementById('vmRecord'), recLabel = recBtn.querySelector('.vm-label');
        var timer = document.getElementById('vmTimer'), review = document.getElementById('vmReview');
        var audioEl = document.getElementById('vmAudio'), sendBtn = document.getElementById('vmSend');
        var redoBtn = document.getElementById('vmRedo'), status = document.getElementById('vmStatus');
        var recorder = null, stream = null, chunks = [], blob = null, started = 0, tick = null, url = null;

        function pickType() {
            var types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
            for (var i = 0; i < types.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) return types[i];
            return '';
        }
        function fmt(s) { return Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2); }
        function say(msg, isError) { status.textContent = msg || ''; status.className = 'form-status' + (isError ? ' error' : ''); }
        function stopStream() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }

        function start() {
            say('');
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
                stream = s; chunks = [];
                var type = pickType();
                try { recorder = type ? new MediaRecorder(s, { mimeType: type }) : new MediaRecorder(s); }
                catch (e) { recorder = new MediaRecorder(s); }
                recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
                recorder.onstop = function () {
                    stopStream(); clearInterval(tick);
                    box.classList.remove('recording'); recLabel.textContent = 'Start recording';
                    blob = new Blob(chunks, { type: (recorder.mimeType || 'audio/webm') });
                    if (!blob.size) { say("I couldn't hear anything. Please try again.", true); return; }
                    if (url) URL.revokeObjectURL(url);
                    url = URL.createObjectURL(blob); audioEl.src = url;
                    review.hidden = false; recBtn.hidden = true; timer.hidden = true;
                };
                recorder.start(1000);
                started = Date.now(); timer.textContent = '0:00 / ' + fmt(MAX_SECONDS);
                box.classList.add('recording'); recLabel.textContent = 'Stop recording';
                tick = setInterval(function () {
                    var sec = (Date.now() - started) / 1000;
                    timer.textContent = fmt(sec) + ' / ' + fmt(MAX_SECONDS);
                    if (sec >= MAX_SECONDS) stop();
                }, 250);
            }).catch(function (err) {
                say(err && err.name === 'NotAllowedError'
                    ? 'Microphone access was blocked. Allow it in your browser settings to leave a voicemail.'
                    : "Couldn't find a microphone to record with.", true);
            });
        }
        function stop() { if (recorder && recorder.state !== 'inactive') recorder.stop(); }
        function reset() {
            blob = null; review.hidden = true; recBtn.hidden = false; timer.hidden = false;
            timer.textContent = '0:00 / ' + fmt(MAX_SECONDS); audioEl.removeAttribute('src'); say('');
        }

        recBtn.addEventListener('click', function () { (recorder && recorder.state === 'recording') ? stop() : start(); });
        redoBtn.addEventListener('click', function () { reset(); start(); });
        sendBtn.addEventListener('click', function () {
            if (!blob) return;
            if (blob.size > MAX_BYTES) { say('That recording is too long. Please keep it under a minute.', true); return; }
            sendBtn.disabled = true; redoBtn.disabled = true; say('Sending…');
            fetch(VM_API + '/voicemail', {
                method: 'POST', body: blob,
                headers: {
                    'Content-Type': blob.type.split(';')[0] || 'audio/webm',
                    'X-VM-Name': encodeURIComponent(document.getElementById('vmName').value.trim()),
                    'X-VM-Email': encodeURIComponent(document.getElementById('vmEmail').value.trim())
                }
            }).then(function (r) {
                if (!r.ok) throw new Error('failed');
                document.getElementById('vmName').value = ''; document.getElementById('vmEmail').value = '';
                reset(); window.location.href = 'thanks.html?voicemail=1';
            }).catch(function () {
                say("Sorry, the voicemail didn't send. Please try again, or use the form above.", true);
            }).then(function () { sendBtn.disabled = false; redoBtn.disabled = false; });
        });
        window.addEventListener('pagehide', stopStream);
    })();
    </script>
