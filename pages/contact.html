    <script>
    /* Contact form: send in the background, clear it, then show our own thank-you page.
       Without JavaScript the form still posts to Formspree normally. */
    (function () {
        var form = document.getElementById('contactForm');
        var status = document.getElementById('formStatus');
        var btn = form.querySelector('button[type="submit"]');
        if (!window.fetch || !window.FormData) return;
        var INBOX = 'https://vishal-chat.vishaljjohn.workers.dev/contact';
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            btn.disabled = true; btn.textContent = 'Sending…';
            status.textContent = ''; status.className = 'form-status';
            // Send to Formspree (email) and save a copy in Vishal's inbox on the site at the same time;
            // the message counts as sent if either one works, so a slow or failed email never loses it.
            var data = new FormData(form);
            var copy = { name: data.get('name'), email: data.get('_replyto'), subject: data.get('subject'), message: data.get('message'), _gotcha: data.get('_gotcha') };
            var saved = fetch(INBOX, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(copy), keepalive: true })
                .then(function (r) { return r.ok; }).catch(function () { return false; });
            var emailed = fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } })
                .then(function (r) { return r.ok; }).catch(function () { return false; });
            Promise.all([saved, emailed])
                .then(function (res) {
                    if (!res[0] && !res[1]) throw new Error('send failed');
                    form.reset();
                    window.location.href = 'thanks.html';
                })
                .catch(function () {
                    status.textContent = "Sorry, that didn't send. Please try again, or email me at vishal.john@louisville.edu.";
                    status.className = 'form-status error';
                    btn.disabled = false; btn.textContent = 'Send message';
                });
        });
        // ---- Vishal's inbox: contact.html?admin (same key as the guestbook) ----
        if (/[?&]admin\b/.test(location.search)) {
            var box = document.createElement('section'); box.className = 'ct-inbox';
            box.innerHTML = '<h2>Inbox</h2><form class="ct-key"><input type="password" placeholder="Moderation key" aria-label="Moderation key" autocomplete="current-password"><button type="submit">Show messages</button></form><p class="ct-msg" role="status"></p><div class="ct-list"></div>';
            form.parentNode.insertBefore(box, form.parentNode.firstChild);
            var keyIn = box.querySelector('input'), msgEl = box.querySelector('.ct-msg'), list = box.querySelector('.ct-list'), key = '';
            try { keyIn.value = JSON.parse(localStorage.getItem('vj_gb_key') || '""') || ''; } catch (e) {}
            function show(msgs) {
                list.textContent = '';
                msgEl.textContent = msgs.length ? msgs.length + ' message' + (msgs.length === 1 ? '' : 's') + ', newest first.' : 'No messages yet.';
                msgs.forEach(function (m) {
                    var c = document.createElement('article'); c.className = 'ct-item';
                    var h = document.createElement('div'); h.className = 'ct-head';
                    var who = document.createElement('b'); who.textContent = m.name;
                    var mail = document.createElement('a'); mail.href = 'mailto:' + m.email + '?subject=' + encodeURIComponent('Re: ' + (m.subject || 'your message')); mail.textContent = m.email;
                    var when = document.createElement('span'); when.textContent = new Date(m.t).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
                    h.appendChild(who); h.appendChild(mail); h.appendChild(when);
                    var sub = document.createElement('p'); sub.className = 'ct-sub'; sub.textContent = m.subject || '(no subject)';
                    var body = document.createElement('p'); body.className = 'ct-body'; body.textContent = m.message;
                    var del = document.createElement('button'); del.type = 'button'; del.className = 'ct-del'; del.textContent = 'Delete';
                    del.addEventListener('click', function () {
                        if (!confirm('Delete this message?')) return;
                        fetch(INBOX + '/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: key, id: m.id }) })
                            .then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) { show(d.messages || []); })
                            .catch(function () { alert('That didn\u2019t work. Try again.'); });
                    });
                    c.appendChild(h); c.appendChild(sub); c.appendChild(body); c.appendChild(del); list.appendChild(c);
                });
            }
            box.querySelector('form').addEventListener('submit', function (e) {
                e.preventDefault(); key = keyIn.value.trim(); msgEl.textContent = 'Loading\u2026';
                fetch(INBOX + '?key=' + encodeURIComponent(key))
                    .then(function (r) { if (r.status === 401) throw new Error('key'); if (r.status === 429) throw new Error('locked'); if (!r.ok) throw new Error('down'); return r.json(); })
                    .then(function (d) { try { localStorage.setItem('vj_gb_key', JSON.stringify(key)); } catch (e) {} show(d.messages || []); })
                    .catch(function (err) { msgEl.textContent = err.message === 'key' ? 'That key didn\u2019t work.' : err.message === 'locked' ? 'Too many wrong keys. Try again in 15 minutes.' : 'Couldn\u2019t load the inbox. Is the Worker deployed?'; });
            });
            if (keyIn.value) box.querySelector('form').dispatchEvent(new Event('submit', { cancelable: true }));
        }
        // coming Back from the thank-you page can restore a stale page; make sure it's empty and usable
        window.addEventListener('pageshow', function (e) {
            if (e.persisted) { form.reset(); btn.disabled = false; btn.textContent = 'Send message'; status.textContent = ''; }
        });
    })();
    </script>
