    <script>
        const mediumUser = 'vishaljjohn';
        const feedUrl = `https://medium.com/feed/@${mediumUser}`;
        const proxies = [
            url => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        ];

        const list = document.getElementById('medium-articles');

        function showError() {
            list.innerHTML = '<li style="color:#888;">Could not load articles right now. <a href="https://medium.com/@' + mediumUser + '" target="_blank" style="color:#0077b6;">Read on Medium directly →</a></li>';
        }

        function renderRSS(xmlText) {
            const parser = new DOMParser();
            const xml = parser.parseFromString(xmlText, 'text/xml');
            const items = xml.querySelectorAll('item');
            if (!items.length) { showError(); return; }
            list.innerHTML = '';
            items.forEach(item => {
                const title = item.querySelector('title')?.textContent || 'Untitled';
                const link = item.querySelector('link')?.textContent ||
                             item.querySelector('guid')?.textContent || '#';
                const pubDate = item.querySelector('pubDate')?.textContent;
                const date = pubDate ? new Date(pubDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                list.innerHTML += `<li style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #eee;">
                    <a href="${link}" target="_blank" rel="noopener noreferrer">${title}</a>
                    <span style="font-size:13px;color:#888;margin-left:16px;white-space:nowrap;">${date}</span>
                </li>`;
            });
        }

        async function tryProxy(index) {
            if (index >= proxies.length) { showError(); return; }
            try {
                const res = await fetch(proxies[index](feedUrl));
                if (!res.ok) throw new Error('bad response');
                // rss2json returns JSON, others return raw XML or wrapped
                const text = await res.text();
                if (proxies[index](feedUrl).includes('rss2json')) {
                    const json = JSON.parse(text);
                    if (json.status !== 'ok') throw new Error('rss2json error');
                    list.innerHTML = '';
                    json.items.forEach(item => {
                        const date = item.pubDate ? new Date(item.pubDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                        list.innerHTML += `<li style="display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #eee;">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                            <span style="font-size:13px;color:#888;margin-left:16px;white-space:nowrap;">${date}</span>
                        </li>`;
                    });
                } else if (text.includes('"contents"')) {
                    const json = JSON.parse(text);
                    renderRSS(json.contents);
                } else {
                    renderRSS(text);
                }
            } catch(e) {
                tryProxy(index + 1);
            }
        }

        list.innerHTML = '<li style="color:#888;">Loading articles...</li>';
        tryProxy(0);
    </script>
