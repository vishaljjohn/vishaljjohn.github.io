    <script>
        const mediumUser = 'vishaljjohn';
        const feedUrl = `https://medium.com/feed/@${mediumUser}`;
        // Browsers can't read Medium's feed directly, so a daily GitHub Action
        // (tools/fetch-medium.py) saves it to assets/medium.json. The public proxies
        // are only a fallback and each gets a short timeout so the page never hangs.
        const sources = [
            { url: () => '../assets/medium.json', kind: 'local' },
            { url: u => `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(u)}`, kind: 'rss2json' },
            { url: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, kind: 'wrapped' },
        ];

        const list = document.getElementById('medium-articles');

        function showError() {
            list.innerHTML = '<li style="color:#888;">Could not load articles right now. <a href="https://medium.com/@' + mediumUser + '" target="_blank" rel="noopener" style="color:#0a6db0;">Read on Medium directly →</a></li>';
        }

        // Build rows with DOM APIs: titles/links come from third-party proxies, so never inject them as HTML.
        function fmtDate(d) {
            return d ? new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
        }
        function renderItems(items) {
            if (!items.length) { showError(); return; }
            list.textContent = '';
            items.forEach(it => {
                const li = document.createElement('li'); li.className = 'post';
                const a = document.createElement('a'); a.className = 'post-link';
                a.href = /^https:\/\//.test(it.link || '') ? it.link : 'https://medium.com/@' + mediumUser;
                a.target = '_blank'; a.rel = 'noopener noreferrer';
                if (it.image && /^https:\/\//.test(it.image)) {
                    const img = document.createElement('img'); img.className = 'post-img'; img.src = it.image; img.alt = '';
                    img.loading = 'lazy'; img.decoding = 'async';
                    img.addEventListener('error', () => img.remove());
                    a.appendChild(img);
                }
                const body = document.createElement('div'); body.className = 'post-body';
                const meta = document.createElement('div'); meta.className = 'post-meta';
                meta.textContent = [fmtDate(it.pubDate), it.minutes ? it.minutes + ' min read' : ''].filter(Boolean).join(' · ');
                const title = document.createElement('h3'); title.className = 'post-title'; title.textContent = it.title || 'Untitled';
                body.appendChild(meta); body.appendChild(title);
                if (it.preview) { const p = document.createElement('p'); p.className = 'post-preview'; p.textContent = it.preview; body.appendChild(p); }
                const more = document.createElement('span'); more.className = 'post-more'; more.textContent = 'Read on Medium →';
                body.appendChild(more); a.appendChild(body); li.appendChild(a); list.appendChild(li);
            });
        }

        function renderRSS(xmlText) {
            const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
            renderItems(Array.from(xml.querySelectorAll('item')).map(item => ({
                title: item.querySelector('title')?.textContent,
                link: item.querySelector('link')?.textContent || item.querySelector('guid')?.textContent,
                pubDate: item.querySelector('pubDate')?.textContent
            })));
        }

        async function trySource(index) {
            if (index >= sources.length) { showError(); return; }
            const src = sources[index];
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 6000);
            try {
                const res = await fetch(src.url(feedUrl), { signal: ctrl.signal, cache: 'no-cache' });
                if (!res.ok) throw new Error('bad response');
                const text = await res.text();
                if (src.kind === 'local' || src.kind === 'rss2json') {
                    const json = JSON.parse(text);
                    if (src.kind === 'rss2json' && json.status !== 'ok') throw new Error('rss2json error');
                    if (!json.items || !json.items.length) throw new Error('empty');
                    renderItems(json.items);
                } else {
                    renderRSS(JSON.parse(text).contents);
                }
            } catch (e) {
                trySource(index + 1);
            } finally {
                clearTimeout(timer);
            }
        }

        list.innerHTML = '<li style="color:#888;">Loading articles...</li>';
        trySource(0);
    </script>
