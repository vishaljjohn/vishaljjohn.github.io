<!doctype html><meta charset=utf8><canvas id=c width=520 height=520></canvas><script>
var dctx=document.getElementById('c').getContext('2d');
dctx.fillStyle='#5b6b7a';dctx.fillRect(0,0,520,520);
// skin face oval to represent the face
dctx.fillStyle='#d8b48f';dctx.beginPath();dctx.ellipse(260,275,92,122,0,0,7);dctx.fill();
dctx.fillStyle='#000';dctx.beginPath();dctx.ellipse(232,255,8,6,0,0,7);dctx.ellipse(288,255,8,6,0,0,7);dctx.fill();
function shade(hex,amt){var h=hex.replace('#','');var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);function cl(v){return Math.max(0,Math.min(255,Math.round(v)));}return 'rgb('+cl(r*(1+amt))+','+cl(g*(1+amt))+','+cl(b*(1+amt))+')';}
function drawWig(c,g,color){var ctx=dctx,cx=g.faceCenter.x,cy=g.faceCenter.y,W=g.faceW,H=g.faceH;ctx.save();ctx.translate(cx,cy);ctx.rotate(g.roll);var oRx=W*0.92,oRy=H*0.98,oCy=-H*0.2;var iRx=W*0.54,iRy=H*0.66,iCy=H*0.1;var vg=ctx.createLinearGradient(0,oCy-oRy,0,oCy+oRy);vg.addColorStop(0,shade(color,0.12));vg.addColorStop(0.55,color);vg.addColorStop(1,shade(color,-0.28));ctx.fillStyle=vg;ctx.beginPath();ctx.ellipse(0,oCy,oRx,oRy,0,0,Math.PI*2,false);ctx.moveTo(iRx,iCy);ctx.ellipse(0,iCy,iRx,iRy,0,0,Math.PI*2,true);ctx.fill();ctx.restore();}
drawWig(null,{faceW:185,faceH:245,roll:0,faceCenter:{x:260,y:275}},'#ff5fa2');
</script>
